<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyPrep✓ ®</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--text:#15171a;--muted:#68707b;--line:#dfe3e8;--accent:#111;--done:#dff3df}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--text)}
header{position:sticky;top:0;z-index:5;background:rgba(246,247,249,.96);backdrop-filter:blur(10px);padding:16px;display:flex;gap:12px;align-items:center;border-bottom:1px solid var(--line)}
h1{font-size:22px;margin:0;flex:1}.pill{font-size:12px;color:var(--muted)}
button,select{font:inherit;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px}
#subjectMenu{position:relative}.menu{display:none;position:absolute;top:48px;left:0;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;box-shadow:0 12px 30px #0002;width:230px}
.menu.open{display:block}.menu button{display:block;width:100%;text-align:left;border:0;margin:3px 0}.menu button:hover{background:#f1f2f4}
main{max-width:1050px;margin:auto;padding:18px 16px 50px}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.stats{margin-left:auto;color:var(--muted);font-size:13px}.legend{font-size:12px;color:var(--muted)}
table{width:100%;border-collapse:separate;border-spacing:0;background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
th,td{padding:12px 10px;border-bottom:1px solid var(--line);text-align:left}th{font-size:12px;color:var(--muted);background:#fafafa}tr:last-child td{border-bottom:0}
.chapter{font-weight:650;cursor:pointer}.chapter:hover{text-decoration:underline}.meta{font-size:11px;color:var(--muted);margin-top:3px}
.check{width:25px;height:25px;padding:0;border:1.5px solid #222;border-radius:6px;background:#fff;display:inline-grid;place-items:center;cursor:pointer;font-weight:800;font-size:17px}
.check.on{background:#fff}.check.all{background:var(--done)}.check:focus{outline:3px solid #bbb}
.detail{display:none;background:#f8f9fa}.detail.show{display:table-row}.detail td{padding:12px 14px}.detailbox{font-size:13px;color:#444}.detailbox b{color:#111}.closehint{color:#888}
@media(max-width:700px){th:nth-child(1),td:nth-child(1){min-width:190px}th,td{padding:10px 7px;font-size:12px}.check{width:23px;height:23px}}

.account-gate{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:9999;padding:20px}.account-card{width:min(420px,100%);background:#fff;border-radius:18px;padding:26px;box-shadow:0 20px 60px rgba(0,0,0,.25)}.account-card h2{margin-top:0}.account-card button{margin:6px 4px 0 0}.account-form input{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;border:1px solid #bbb;border-radius:10px;font-size:15px}.account-message{min-height:20px;margin-bottom:0}.account-card .primary{background:#111;color:#fff;border:0}.account-gate[hidden],.account-form[hidden],#returning[hidden]{display:none!important}
</style></head><body>

<div id="subjectMenu"><button id="subjectBtn">☰ Subjects</button><div class="menu" id="menu"></div></div>

let subject="Biology", state=JSON.parse(localStorage.getItem("myprep_state")||"{}"); let currentUsername="";
const menu=document.getElementById("menu"), rows=document.getElementById("rows"), genre=document.getElementById("genre");
function key(c,i){return c.subject+"|"+c.std+"|"+c.name+"|"+i}
function selected(){return DATA.filter(x=>x.subject===subject)}
function renderMenu(){menu.innerHTML=["Physics","Chemistry","Biology"].map(s=>`<button onclick="setSubject('${s}')">${s}</button>`).join("")}
function setSubject(s){subject=s;document.getElementById("subjectBtn").textContent="☰ "+s;document.getElementById("menu").classList.remove("open");populateGenre();render()}
function populateGenre(){let vals=[...new Set(selected().map(x=>x.genre))];genre.innerHTML='<option value="all">All branches</option>'+vals.filter(x=>x!=="None").map(x=>`<option>${x}</option>`).join("")}
function filtered(){
 let a=selected().filter(x=>document.getElementById("year").value==="all"||x.std===document.getElementById("year").value)
 .filter(x=>genre.value==="all"||x.genre===genre.value);
 let s=document.getElementById("sort").value;
 if(s==="difficultyDesc")a.sort((x,y)=>y.difficulty-x.difficulty);
 if(s==="difficultyAsc")a.sort((x,y)=>x.difficulty-y.difficulty);
 if(s==="priorityDesc")a.sort((x,y)=>y.priority-x.priority);
 if(s==="priorityAsc")a.sort((x,y)=>x.priority-y.priority);
 return a;
}
function render(){
 let a=filtered(); rows.innerHTML="";
 a.forEach((c)=>{
  let id=c.subject+"|"+c.std+"|"+c.name, vals=[0,1,2].map(i=>!!state[key(c,i)]), all=vals.every(Boolean);
  let tr=document.createElement("tr"); tr.innerHTML=`<td class="chapter" onclick="toggleDetail('${CSS.escape(id)}')">${c.name}<div class="meta">${c.std} • ${c.genre}</div></td>`+
   vals.map((v,i)=>`<td><button class="check ${v?(all?"all":"on"):""}" aria-label="toggle" onclick="event.stopPropagation();toggle('${id}',${i})">${v?"✓":""}</button></td>`).join("");
  rows.appendChild(tr);
  let d=document.createElement("tr");d.className="detail";d.id="d-"+id.replaceAll("|","_").replaceAll(" ","_");
  d.innerHTML=`<td colspan="4"><div class="detailbox"><b>${c.genre==="None"?"":c.genre+" • "}${c.std}</b> — ${c.description}<br><span class="closehint">Tap the chapter name again to collapse.</span></div></td>`;rows.appendChild(d);
 });
 let total=a.length*3,done=a.reduce((n,c)=>n+[0,1,2].filter(i=>state[key(c,i)]).length,0);document.getElementById("stats").textContent=`${done}/${total} tasks complete • ${a.length} chapters`;
}
async function toggle(id,i){let c=DATA.find(x=>x.subject+"|"+x.std+"|"+x.name===id);state[key(c,i)]=!state[key(c,i)];render(); if(currentUsername) await MyPrepAccount.saveState(state)}
function toggleDetail(id){let el=document.getElementById("d-"+id.replaceAll("|","_").replaceAll(" ","_")); if(el)el.classList.toggle("show")}
document.getElementById("subjectBtn").onclick=()=>menu.classList.toggle("open");
document.getElementById("sort").onchange=render;document.getElementById("year").onchange=render;genre.onchange=render;
document.getElementById("reset").onclick=async()=>{if(confirm("Reset all saved ticks?")){state={};render();if(currentUsername) await MyPrepAccount.saveState(state)}};
renderMenu();populateGenre();render();

  const choice=document.getElementById("accountChoice"), signup=document.getElementById("signupForm"), login=document.getElementById("loginForm"), returning=document.getElementById("returning");
  function openApp(){gate.hidden=true;app.hidden=false;render()}
  function showOnly(el){choice.hidden=true;signup.hidden=true;login.hidden=true;returning.hidden=true;el.hidden=false}
  const session=await MyPrepAccount.restoreSession();
  if(session){ currentUsername=session.username; state=MyPrepAccount.objectFromIds(session.progress); document.getElementById("returningText").textContent=`Welcome back, ${session.username}. Your saved progress is ready.`; showOnly(returning); }
  else { gate.hidden=false; app.hidden=true; }
  document.getElementById("createAccountBtn").onclick=()=>{signup.hidden=false;choice.hidden=true};
  document.getElementById("loginAccountBtn").onclick=()=>{login.hidden=false;choice.hidden=true};
  document.getElementById("backFromSignup").onclick=()=>{signup.hidden=true;choice.hidden=false};
  document.getElementById("backFromLogin").onclick=()=>{login.hidden=true;choice.hidden=false};
  document.getElementById("continueBtn").onclick=openApp;
  document.getElementById("differentBtn").onclick=()=>{returning.hidden=true;choice.hidden=false};
  signup.onsubmit=async e=>{e.preventDefault();const m=document.getElementById("signupMessage");try{const old=Object.keys(state).filter(k=>state[k]);const r=await MyPrepAccount.signup(document.getElementById("signupUsername").value,document.getElementById("signupPin").value);currentUsername=r.username;state=MyPrepAccount.objectFromIds(r.progress||[]);if(old.length){state={};old.forEach(k=>state[k]=true);await MyPrepAccount.saveState(state);localStorage.removeItem("myprep_state")}openApp()}catch(err){m.textContent=err.message}};
  login.onsubmit=async e=>{e.preventDefault();const m=document.getElementById("loginMessage");try{const r=await MyPrepAccount.login(document.getElementById("loginUsername").value,document.getElementById("loginPin").value);currentUsername=r.username;state=MyPrepAccount.objectFromIds(r.progress||[]);openApp()}catch(err){m.textContent=err.message}};
}
startAccountUI();
</script></div></body></html>
